[package]
name = "dtv_x"
version = "0.1.0"
description = "DTV X - Live Stream Client"
authors = ["cookie-kangd"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dtv_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
prost-build = "0.14.4"

[dependencies]
# tray-icon：系统托盘（关闭窗口最小化到托盘）；
# image-png / image-ico：让 tauri 能解码打包图标，default_window_icon() 才有值、托盘才有图标
tauri = { version = "2.12.1", features = ["macos-private-api", "tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2.7.0"
# 单实例互斥：同一个 exe 只允许一个进程在跑。
# 没有它时，窗口关到托盘后再次双击快捷方式会开出第二个 DTV_X：
# 两份弹幕监听 + 两个静态图片代理（端口相同会AddrInUse）+ 两套 WebView2，内存直接翻倍。
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-window-state = "2.5.0"
window-vibrancy = "0.8.1"
 serde = { version = "1.0.229", features = ["derive"] }
 serde_json = "1.0.151"
 md-5 = "0.11.0"
 deno_core = "0.412.0"
 regex = "1.13.1"
 tokio = { version = "1.53.2", features = ["full"] }
 tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
 url = "2.5.8"
 native-tls = "0.2.18"
 rand = "0.10.3"
 futures-util = "0.3.34"
 urlencoding = "2.1.3"
 percent-encoding = "2.3.2"
 serde_urlencoded = "0.7.1"
 reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "query", "form", "json", "stream", "cookies", "brotli", "gzip", "blocking"] }
 actix-web = "4.15.0"
 actix-cors = "0.7.2"
 awc = { version = "3.8.2", features = ["tls-rustls-0_22"] }
bytes = "1.12.1"
bytes04 = { package = "bytes", version = "0.4.12" }
log = "0.4.34"
env_logger = "0.11.11"
thiserror = "2.0.21"
base64 = "0.23.1"
anyhow = "1.0.104"
 once_cell = "1.21.4"
 hex = "0.4.3"
 http = "1.5.0"
 # Huya TARS codec
 tars-stream = "0.1.1"
  
 # Force curl to use platform TLS (SecureTransport on macOS) and avoid OpenSSL linkage
 # Dependencies for Douyin Danmaku
 prost = "0.14.4"
 prost-types = "0.14.4"
 flate2 = "1.1.10"
 lazy_static = "1.5.1"
 chrono = "0.4.45"
 
 specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
 tauri-plugin-os = "2.4.0"
 tungstenite = { version = "0.30.0", features = ["native-tls"] }
 brotlic = "0.8.2"
 cookie = "0.18.2"
 html-escape = "0.2.15"
rfd = "0.17.2"
local-ip-address = "0.6.13"
mdns-sd = "0.21.5"

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
