<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;font:16px system-ui;color:white}header{padding:14px 24px;background:#17191e}h2{margin:0 0 8px}#video{margin:20px 40px;width:calc(100% - 80px);height:420px;position:relative;background:transparent;border:2px solid #28dc95;box-sizing:border-box}.danmu{position:absolute;top:40%;left:12%;font-size:28px;font-weight:bold;color:#fff;text-shadow:0 2px 3px black;z-index:2}.controls{position:absolute;bottom:0;background:#121520bb;backdrop-filter:blur(4px);padding:16px;left:0;right:0;display:flex;gap:16px}button{padding:8px 18px;background:#24c88b;color:#111;border:0;border-radius:6px;font-size:16px}pre{background:#15181d;margin:0;padding:16px 24px;font-size:12px;white-space:pre-wrap}#badge{position:absolute;right:20px;top:20px;background:#e0236b;padding:10px;border-radius:8px}
</style><header><h2>libmpv 原生画面 + 现有 HTML 叠加兼容性探针</h2><span id="status">准备启动内核</span></header><div id="video"><div id="badge">HTML 标记：必须始终可见</div><div class="danmu">HTML 弹幕：应覆盖在彩色视频上</div><div class="controls"><button id="stop">停止原生流</button><button id="start">重新打开</button><span>原生画面不能遮挡这些控件</span></div></div><pre id="data"></pre><script>
const invoke=(command,args)=>window.__TAURI_INTERNALS__.invoke(command,args);
const status=document.getElementById('status');document.addEventListener('pointerdown',e=>{status.textContent='pointer '+(e.target.id||e.target.tagName);},true);
async function rect(){const r=document.getElementById('video').getBoundingClientRect(),d=window.devicePixelRatio;await invoke('probe_rect',{x:Math.round(r.x*d),y:Math.round(r.y*d),width:Math.round(r.width*d),height:Math.round(r.height*d)});}
async function start(){try{status.textContent=await invoke('probe_start');await rect();}catch(e){status.textContent=String(e);}}
document.getElementById('start').onclick=start;document.getElementById('stop').onclick=async()=>{await invoke('probe_stop');status.textContent='已停止，原生画面应消失';};
window.addEventListener('resize',()=>rect().catch(console.error));window.addEventListener('focus',()=>rect().catch(console.error));setInterval(()=>{if(document.hasFocus())rect().catch(console.error);},500);setInterval(async()=>{try{document.getElementById('data').textContent=JSON.stringify(await invoke('probe_snapshot'),null,2);}catch(e){status.textContent=String(e);}},500);
async function selftest(){
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const assert=(ok,msg)=>{if(!ok)throw Error(msg);};
 try {
  await start(); await invoke('probe_focus'); await sleep(1700);
  const first=await invoke('probe_snapshot');
  assert(first.loaded && first.width===320 && first.position>0,'first video not configured');
  const btn=document.getElementById('stop').getBoundingClientRect(),d=devicePixelRatio;
  const hit=await invoke('probe_hit',{x:Math.round((btn.x+btn.width/2)*d),y:Math.round((btn.y+btn.height/2)*d)});
  assert(hit.belongsToUi,'control hit test escaped UI: '+JSON.stringify(hit));
  await invoke('probe_report',{report:{stage:'first-frame-and-hit',first,hit}});
  await invoke('probe_window_action',{action:'minimize'}); await sleep(400);
  assert((await invoke('probe_snapshot')).surfaceVisible===false,'video underlay remains visible after minimize');
  await invoke('probe_window_action',{action:'restore'}); await invoke('probe_focus'); await sleep(400); await rect();
  assert((await invoke('probe_snapshot')).surfaceVisible===true,'video underlay not restored');
  await invoke('probe_stop');
  assert((await invoke('probe_snapshot')).loaded===false,'stop retained player');
  await start(); await sleep(1700);
  const reopened=await invoke('probe_snapshot');
  assert(reopened.loaded && reopened.width===320 && reopened.position>0,'reopen video not configured');
  await invoke('probe_report',{report:{done:true,passed:true,stage:'stop-reopen',reopened}});
 } catch(e){ await invoke('probe_report',{report:{done:true,passed:false,error:String(e)}}); }
}
selftest();
</script></html>
